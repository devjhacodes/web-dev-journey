<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - Projects</title>
    <style>
        body {
            font-family: Arial;
        }

        .subscribe-btn{
            background-color: black;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .is-subscribed{
            background-color: rgb(240,240,240);
            color: black;
        }

        .cost-input{
            font-size: 15px;
            padding: 10px;
        }

        .calculate-btn{
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }

    </style>
</head>

<body>
    <p>
        YouTube Subscribe Button
    </p>
    <button onclick="
       subscribe()
    " class="js-subscribe-button subscribe-btn">
        Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input class="js-value cost-input" type="text" placeholder="Cost of order" onkeydown="
     handleCostKey(event)
    ">
    <button class="calculate-btn" onclick="
       calculation()
    ">Calculate</button>
    <p class="js-result"></p>

    <script>

        function handleCostKey(event) {
            if (event.key === 'Enter') {
                calculation()
            }
        }

        function calculation() {
            const inputElement = document.querySelector('.js-value');

            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10;
            } else {
                cost = cost;
            }

            document.querySelector('.js-result')
                .innerHTML = `$${cost}`
        }


        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
                buttonElement.classList.add('is-subscribed')
            } else {
                buttonElement.innerHTML = 'Subscribe';
                buttonElement.classList.remove('is-subscribed')
            }
        }

    </script>
</body>
</html>
