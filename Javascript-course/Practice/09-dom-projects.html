<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - Projects</title>
</head>

<body>
    <p>
        YouTube Subscribe Button
    </p>
    <button onclick="
       subscribe()
    " class="js-subscribe-button">
        Subscribe
    </button>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input class="js-value" type="text" placeholder="Cost of order" onkeydown="
     handleCostKey(event)
    ">
    <button onclick="
       calculation()
    ">Calculate</button>
    <p class="js-result"></p>

    <script>

        function handleCostKey(event) {
            if (event.key === 'Enter') {
                calculation()
            }
        }

        function calculation() {
            const inputElement = document.querySelector('.js-value');

            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10;
            } else {
                cost = cost;
            }

            document.querySelector('.js-result')
                .innerHTML = `$${cost}`
        }


        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
            } else {
                buttonElement.innerHTML = 'Subscribe';
            }
        }

    </script>
</body>

</html>
