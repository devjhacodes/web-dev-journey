<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/12-rock-paper-scissor.css">
</head>

<body>
  <p class="title">Rock Paper Scissors</p>

  <button class="move-button" onclick="playGame('rock')">
    <img src="/images/rock-emoji.png" class="move-icon" alt="Rock">
  </button>

  <button class="move-button" onclick="playGame('paper')">
    <img src="/images/paper-emoji.png" class="move-icon" alt="Paper">
  </button>

  <button class="move-button" onclick="playGame('scissors')">
    <img src="/images/scissors-emoji.png" class="move-icon" alt="Scissors">
  </button>

  <p class="js-result result"></p>
  <p class="js-choice">
  </p>
  <p class="js-score score"></p>

  <button onclick="
    score.win = 0;
    score.lose = 0;
    score.tie = 0;
    localStorage.removeItem('score');
    updateScoreElement();
  " class="reset-score-btn">Reset Score</button>

  <button class="auto-play-btn" onclick="
    autoPlay();
  ">Auto Play</button>

  <script src="scripts/12-rock-paper-scissor.js"></script>

</body>
</html>
