<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9d - 9f</title>
</head>
<body>
    <input type="text" class="js-name" placeholder="Name" onkeydown="
    handleKey(event)
    ">
    <button class="js-submit" onclick="
       showName()
    ">Submit</button>

    <p class="js-result"></p>

    <script>
        
        function handleKey (event){
            if (event.key === 'Enter'){
                showName()
            }
        }

        function showName(){
            let name = document.querySelector('.js-name');

            document.querySelector('.js-result').innerHTML = `Your name is: ${name.value}`;
        }
    </script>
</body>
</html>
