<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10a</title>
    <style>
        body{
            font-family: Arial;
        }
        .add-cart-btn{
            background-color: rgb(255,216,20);
            color: black;
            border:none;
            padding: 10px 50px;
            border-radius: 50px;
            cursor: pointer;
        }

        .request-btn{
            background-color: black;
            color:white;
            font-weight: bold;
            border:none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        .schedule-btn{
            background-color: rgb(230,230,230);
            color: black;
            font-weight: bold;
            border:none;
            padding: 10px 20px;
            cursor: pointer;

        }
    </style>
</head>
<body>
    <p>10a. Amazon button</p>
    <button class="add-cart-btn">
        Add to Cart
    </button>

    <p>10b. Uber buttons</p>
    <button class="request-btn">
        Request now
    </button>

    <button class="schedule-btn">
        Schedule for later
    </button>
</body>
</html>
