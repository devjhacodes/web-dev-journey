<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7g to 7i</title>
</head>
<body>
    <script>
        function convertLength(length, from, to){
            if (from === 'miles' && to ==='km'){
                km = length * 1.6;
                console.log(`${length} miles is equal to ${km} km`);
            }
            else if (from === 'km' && to === 'miles'){
                miles = length / 1.6;
                console.log(`${length} km is equal to ${miles} miles`);
            }
            else if (from === 'km' && to === 'ft'){
                ft = length * 3281;
                console.log(`${length} km is equal to ${ft} ft`);
            }
            else if (from === 'miles' && to === 'ft'){
                ft = length * 5280;
                console.log(`${length} miles is equal to ${ft} ft`);
            }
            else if (from === 'ft' && to === 'miles'){
                console.log(`No conversion needed. ${length} ${from} is equal to ${length} ${to}`);
            }
            else {
                console.log(`Invalid unit conversion from ${from} to ${to}`);
            }
        }

        convertLength(50, 'miles', 'km')
        convertLength(32, 'km', 'miles')
        convertLength(50, 'km', 'km')
        convertLength(5, 'miles', 'km')
        convertLength(5, 'miles', 'ft')
        convertLength(5, 'km', 'ft')
        convertLength(5, 'km', 'lbs')

    </script>
</body>
</html>
