<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 4 : HTML CSS Review With JAVASCRIPT</title>
    <style>
        .add-to-cart{
            background-color:rgb(250, 250, 47);
            color: black;
        }

        .buy-now{
            background-color:rgb(250, 152, 47);
            color: black;
        }
    </style>
</head>
<body>
    <P>Adults Plain Cotton T-shirt</P>
    <p>Price: $7.99</p>
    <button class="add-to-cart" onclick="alert('Added')">Add to Cart</button>
    <button class="buy-now" onclick="console.log('Loading...'), alert('Purchased')">Buy Now</button>
</body>
</html>
