<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9g & 9h</title>
</head>

<body>
    
    
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input class="js-value" type="text" placeholder="Cost of order" onkeydown="
     handleCostKey(event)
    ">
    <button onclick="
       calculation()
    ">Calculate</button>
    <p class="js-result"></p>

    <input placeholder="Type something" class="js-input"
      onkeyup="
        const inputElement = document.querySelector('.js-input');
        document.querySelector('.js-message')
          .innerHTML = inputElement.value;
      ">

    <p class="js-message"></p>

    <script>


        function handleCostKey(event) {
            if (event.key === 'Enter') {
                calculation()
            }
        }

        function calculation() {
            const inputElement = document.querySelector('.js-value');

            let cost = Number(inputElement.value * 100);

            if (cost < 4000) {
                cost = cost + 1000;
            } else {
                cost = cost;
            }

            document.querySelector('.js-result')
                .innerHTML = `$${cost / 100}`
        }


        

    </script>
</body>

</html>
