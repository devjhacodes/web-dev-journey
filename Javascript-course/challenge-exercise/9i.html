<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9i</title>
</head>

<body>

    <p>
        Cart Quantity
    </p>

    <button onclick="
    console.log(`cart quantity: ${cartquantity}`);
    displayCartQuantity()
    ">Show Quantity</button>

    <button onclick="
      updateCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
      updateCartQuantity(2);
    ">+2</button>

    <button onclick="
      updateCartQuantity(3);
    ">+3</button>

    <button onclick="
      updateCartQuantity(4);
    ">+4</button>

    <button onclick="
      updateCartQuantity(5);
    ">+5</button>

    <button onclick="
      updateCartQuantity(-1);
    ">-1</button>

    <button onclick="
      updateCartQuantity(-2);
    ">-2</button>

    <button onclick="
      updateCartQuantity(-3);
    ">-3</button>

    <button onclick="
     cartquantity = 0;
     console.log('cart reset.');
     displayCartQuantity()
    ">Reset Cart</button>

    <p class="js-quantity"></p>

    <script>

        let cartquantity = 0;


        function updateCartQuantity(amount) {
            if (cartquantity + amount > 10) {
                alert('Cart is full');
                return;
            } 
            if (cartquantity + amount < 0) {
                alert('Not enough items in cart');
                return;
            }
            cartquantity += amount;
            displayCartQuantity()
        }


        function displayCartQuantity(){
            document.querySelector('.js-quantity').innerHTML = `Cart quantity: ${cartquantity}`
        }
    </script>
</body>

</html>
