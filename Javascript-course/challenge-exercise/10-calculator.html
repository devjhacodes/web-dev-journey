<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9j</title>
    <link rel="stylesheet" href="styles/10-calculator.css">
</head>
<body>
    <p class="js-display cal-display"></p>
    <p>
        <button class="button gray-button" onclick="
            addToCalculation('1');
        ">1</button>
    
        <button class="button gray-button" onclick="
            addToCalculation('2');
        ">2</button>
    
        <button class="button gray-button" onclick="
            addToCalculation('3');
        ">3</button>
    
        <button class="cal-btn button" onclick="
            addToCalculation('+');
        ">+</button>
    </p>

    <p>
        <button class="button gray-button" onclick="
            addToCalculation('4');
        ">4</button>
    
        <button class="button gray-button" onclick="
            addToCalculation('5');
        ">5</button>
    
        <button class="button gray-button" onclick="
            addToCalculation('6');
        ">6</button>
    
        <button class="cal-btn button" onclick="
            addToCalculation('-');
        ">-</button>
    </p>

    <p>
        <button class="button gray-button" onclick="
            addToCalculation('7');
        ">7</button>
    
        <button class="button gray-button" onclick="
            addToCalculation('8');
        ">8</button>
    
        <button class="button gray-button" onclick="
            addToCalculation('9');
        ">9</button>
    
        <button class="cal-btn button" onclick="
            addToCalculation('*');
        ">*</button>
    </p>

    <p>
        <button class="button gray-button" onclick="
                addToCalculation('0');
            ">0</button>
    
        <button class="button gray-button" onclick="
                addToCalculation('.');
            ">.</button>
    
        <button class="button gray-button" onclick="
            calculation = eval(calculation);
            console.log(calculation);

            localStorage.setItem('calculation',calculation);
            displayCalculation();
        ">=</button>
    
        <button class="cal-btn button" onclick="
                addToCalculation('/');
            ">/</button>
    </p>

    <p>
        <button class="button gray-button clear-button" onclick="
          calculation = '';

          localStorage.setItem('calculation',calculation);
          displayCalculation();
        ">Clear</button>
    </p>
    

    <script src="scripts/10-calculator.js"></script>
</body>
</html>
