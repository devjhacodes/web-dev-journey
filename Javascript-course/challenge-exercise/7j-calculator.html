<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <p>
        <button onclick="
            addToCalculation('1');
        ">1</button>
    
        <button onclick="
            addToCalculation('2');
        ">2</button>
    
        <button onclick="
            addToCalculation('3');
        ">3</button>
    
        <button onclick="
            addToCalculation('+');
        ">+</button>
    </p>

    <p>
        <button onclick="
            addToCalculation('4');
        ">4</button>
    
        <button onclick="
            addToCalculation('5');
        ">5</button>
    
        <button onclick="
            addToCalculation('6');
        ">6</button>
    
        <button onclick="
            addToCalculation('-');
        ">-</button>
    </p>

    <p>
        <button onclick="
            addToCalculation('7');
        ">7</button>
    
        <button onclick="
            addToCalculation('8');
        ">8</button>
    
        <button onclick="
            addToCalculation('9');
        ">9</button>
    
        <button onclick="
            addToCalculation('*');
        ">*</button>
    </p>

    <p>
        <button onclick="
                addToCalculation('0');
            ">0</button>
    
        <button onclick="
                addToCalculation('.');
            ">.</button>
    
        <button onclick="
            calculation = eval(calculation);
            console.log(calculation);
        ">=</button>
    
        <button onclick="
                addToCalculation('/');
            ">/</button>
    </p>
    

    <script>
        let calculation ='';

        function addToCalculation(value) {
            calculation += value;
            console.log(calculation);
        }
    </script>
</body>
</html>
