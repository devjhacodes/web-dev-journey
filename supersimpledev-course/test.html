<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <div class="container">
        <div class="order-summary-header">
            <p>Order Summary</p>
        </div>

        <div class="order-summary-body">
            <div class="item">
                <div class="item-images">
                    <div class="badge">-20%</div>
                    <img class="image" src="charging_cable.jpg" alt="Charging Cable">
                </div>
                <div class="item-details">
                    <p>Wireless Headphones</p>
                    <p>Qty : 1</p>
                </div>
                <div class="item-price">
                    <p>$120.00</p>
                </div>
            </div>
            <div class="item">
                <div class="item-images">
        
                    <img class="image"src="wireless.jpg" alt="Wireless Headphones">
        
                </div>
                <div class="item-details">
                    <p>USB-C Cable</p>
                    <p>Qty : 2</p>
                </div>
                <div class="item-price">
                    <p>$25.00</p>
                </div>
            </div>
        </div>
        
        <div class="order-summary">
            <div class="prcie-detail">
                <div class="price">
                    <p>Subtotal</p>
                    <p>$145.00</p>
                </div>
                <div class="price">
                    <p>Shipping</p>
                    <p>$5.00</p>
                </div>
                <div class="price">
                    <p>Total</p>
                    <p>$150.00</p>
                </div>
            </div>
        </div>

        <div class="place-order">
            <button>Place Order</button>
        </div>
    </div>
</body>
</html>
