<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 12 : Flexbox</title>
    <link rel="stylesheet" href="flex.css">
</head>
<body>
    <h3>
        12a.
    </h3>
    <div class="flex-container">
        <div class="box-1">200px</div>
        <div class="box-2">75px</div>
    </div>

    <h3>
        12b.
    </h3>
    <div class="item-container">
        <div class="item-1">item1</div>
        <div class="item-2">item2</div>
        <div class="item-3">item3</div>
    </div>

    <h3>
        12c.
    </h3>
    <div class="items2-container">
        <div class="item1">item1</div>
        <div class="item2">item2</div>
        <div class="item3">item3</div>
        <div class="item4">item4</div>
    </div>

    <h3>
        12d.
    </h3>
    <div class="ite-container">
        <div class="ite-1">item1</div>
        <div class="ite-2">item2</div>
    </div>
</body>
</html>
