<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Block and Inline-Block</title>
    <link rel="stylesheet" href="display.css">
</head>
<body>
    <h3>
        8a. Create 2 text boxes and put them on separate lines
    </h3>
    <input class="text-input" type="text" placeholder="Name">
    <input class="email-input" type="text" placeholder="Email">

    <h3>
        8b. Create a paragraph and 2 buttons and place them on the same line
    </h3>
    <p class="paragraph">
        Thanks for chatting with our customer support. Would you like to take our quick survey?
    </p>
    <button class="yes-button">Yes</button>
    <button class="no-button">No</button>

    <h3>
        8c.
    </h3>
    <img class="logo" src="Google_2011_logo.png" alt="Google Logo">
    <input class="search-box" type="text" placeholder="Search Google or Type a URL">
</body>
</html>
