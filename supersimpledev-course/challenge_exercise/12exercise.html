<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 12 : flex</title>
    <link rel="stylesheet" href="12exercise.css">
</head>
<body>
    <h3>
        12e.

    <div class="flex-container">
        <div class="home">
            <div class="box-1">Home</div>
            <div class="num">14</div>
        </div>

        <div class="notification">
            <div class="box-2">Notifications</div>
            <div class="num">3</div>

        <div class="messages">
            <div class="box-3">Messages</div>
            <div class="num">5</div>
        </div>
    </div>

    <h3>
        12g.
    </h3>

    <div class="row">
      <img class="profile-picture" src="cat.jpg">
      <div class="info">
        <p class="name">oliver</p>
        <p class="handle">the cat</p>
        <p class="category">Popular</p>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="cat-2.jpg">
      <div class="info">
        <p class="name">Mimi</p>
        <p class="handle">Sleepy Cat</p>
        <p class="category">Popular</p>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <div class="row">
      <img class="profile-picture" src="cat-3.png">
      <div class="info">
        <p class="name">Rex</p>
        <p class="handle">Happy Bulldog</p>
        <p class="category">Popular</p>
      </div>
      <button class="follow-button">Follow</button>
    </div>

    <h3>
        12f.
    </h3>

    <div class="header">
      <div class="home-link">Home</div>
