<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="youtube.css">
</head>
<body>

    <input class="search-box" type="text" placeholder="Search">

    <div class="vedio-preview">

        <div class="thumbnail-row">
            <img class="thumbnail" src="/images/thumbnail-1.webp" alt="thumbnail">
        </div>

        <div>

            <div class="channel-picture">
                <img class="profile-pic"src="/images/channel-1.jpeg" alt="channel-logo">
            </div>

            <div class="vedio-info">
            
                <p class="vedio-title">
                    Talking Tech and AI with Google CEO Sundar Pichai!
                </p>
                <p class="vedio-author">
                    Marques Brownlee
                </p>
            
                <p class="vedio-stats">
                    3.4M views · 6 months ago
                </p>
            
            </div>
        
        </div>

    </div>

    <div class="vedio-preview">
    
        <div class="thumbnail-row">
            <img class="thumbnail" src="/images/thumbnail-2.webp" alt="thumbnail">
        </div>
    
        <div>

            <div class="channel-picture">
                <img class="profile-pic" src="/images/channel-2.jpeg" alt="channel-logo">
            </div>

            <div class="vedio-info">
                <p class="vedio-title">
                    Try Not To Laugh Challenge #9
                </p>
                <p class="vedio-author">
                    Markiplier
                </p>
            
                <p class="vedio-stats">
                    19M views · 4 years ago
                </p>
            </div>
        </div>
    
    </div>

</body>
</html>
